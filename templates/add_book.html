{% extends "base.html" %}

{% block content %}


<div class="container mt-5">
    <h2>Add New Book</h2>

    <form action="/add-book" method="POST">
        <div class="mb-3">
            <label for="title" class="form-label">Book Title</label>
            <input
                type="text"
                class="form-control"
                id="title"
                name="title"
                value="{{ book[1] if book is defined else '' }}"
                placeholder="Enter book name"
                required
            >
        </div>

        <div class="mb-3">
            <label for="author" class="form-label">Author</label>
            <input
                type="text"
                class="form-control"
                id="author"
                name="author"
                placeholder="Enter author"
                value="{{ book[2] if book is defined else '' }}"
                required
            >
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <input
                type="text"
                class="form-control"
                id="category"
                name="category"
                placeholder="Which Category"
                value="{{ book[3] if book is defined else '' }}"
                required
            >
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select
                class="form-select" required
                id="status"
                name="status"
            >
            <option value="Available"{% if book is defined and book[4] == 'Available' %}selected{% endif %}>Available</option>
            <option value="Issued"{% if book is defined and book[4] == 'Issued' %}selected{% endif %}>Issued</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">
            Add Book
        </button>
    </form>
</div>

{% endblock %}
